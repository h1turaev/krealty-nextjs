version: '3.8'

services:
  krealty-client:
    container_name: krealty-client
    restart: always
    image: node:18.20.8
    ports:
      - 3001:3001
    volumes:
      - ./:/usr/src/krealty-client
    working_dir: /usr/src/krealty-client
    environment:
      - PORT=3001
      # Server-side (SSR) uchun - container nomi orqali
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://krealty-api:3000}
      - REACT_APP_API_GRAPHQL_URL=${REACT_APP_API_GRAPHQL_URL:-http://krealty-api:3000/graphql}
      - REACT_APP_API_WS=${REACT_APP_API_WS:-ws://krealty-api:3000}
      # Client-side (browser) uchun - server IP yoki domain
      # Browser server IP dan murojaat qilgani uchun, localhost o'rniga server IP ishlatish kerak
      # Agar backend bir xil serverda bo'lsa, server IP ishlatish kerak (masalan: 72.61.117.122:3000)
      # Agar backend boshqa serverda bo'lsa, backend server IP yoki domain yozish kerak
      - NEXT_PUBLIC_REACT_APP_API_URL=${NEXT_PUBLIC_REACT_APP_API_URL:-http://72.61.117.122:3000}
      - NEXT_PUBLIC_REACT_APP_API_GRAPHQL_URL=${NEXT_PUBLIC_REACT_APP_API_GRAPHQL_URL:-http://72.61.117.122:3000/graphql}
      - NEXT_PUBLIC_REACT_APP_API_WS=${NEXT_PUBLIC_REACT_APP_API_WS:-ws://72.61.117.122:3000}
    networks:
      - monorepo-network
    #PRODUCTION
    command: bash -c "yarn install && yarn run build && NODE_ENV=production yarn start -p 3001"

networks:
  monorepo-network:
    driver: bridge
